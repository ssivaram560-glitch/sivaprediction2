<!DOCTYPE html>
<html lang="ta">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIVA ULTRA AI V57.5 - DRAGON SHIELD</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght=500;600;700&display=swap');
:root{--bg:#06060f;--panel:#0b0b1d;--border:#151528;--accent:#00e5ff;--green:#00ff88;--red:#ff2d55;--gold:#ffd60a;--violet:#bf5af2;--text:#b0c4de;--dim:#363660;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:'Rajdhani',sans-serif;color:var(--text);min-height:100vh;padding-bottom:70px;}
.wrap{position:relative;z-index:1;max-width:440px;margin:0 auto;padding:10px;}

/* உன்னோட அதே ஸ்டைலிஷ் டிசைன் */
.hdr{text-align:center;padding:15px 0;}
.hdr h1{font-family:'Orbitron';font-size:16px;color:var(--accent);letter-spacing:3px;text-shadow:0 0 15px var(--accent);}
.live-badge{display:inline-flex;align-items:center;gap:5px;background:rgba(0,255,136,0.07);border:1px solid rgba(0,255,136,0.18);border-radius:20px;padding:3px 12px;font-size:10px;color:var(--green);margin-top:5px;}
.dot{width:6px;height:6px;background:var(--green);border-radius:50%;animation:blink 1s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

.main-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:30px 20px;text-align:center;margin-top:20px;box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
.period-info { font-family: 'Orbitron'; color: var(--gold); margin-bottom: 15px; font-size: 14px; }
.status-msg { color: var(--accent); font-family: 'Orbitron'; font-size: 14px; margin: 20px 0; }
.timer-val { font-size: 40px; font-weight: 900; color: #fff; margin-bottom: 10px; }

/* Prediction Styles */
.res-big { font-size: 50px; font-weight: 900; color: var(--gold); text-shadow: 0 0 20px var(--gold); }
.res-small { font-size: 50px; font-weight: 900; color: var(--accent); text-shadow: 0 0 20px var(--accent); }
</style>
</head>
<body>

<div class="wrap">
    <div class="hdr">
        <h1>SIVA ULTRA AI V57.5</h1>
        <div class="live-badge"><div class="dot"></div> LIVE ENGINE</div>
    </div>

    <div class="main-card" id="displayCard">
        <div class="period-info">PERIOD: <span id="periodText">---------</span></div>
        <div class="timer-val" id="timerDisplay">00:00</div>
        
        <!-- இங்க தான் உன்னோட அந்த Calculating மெசேஜ் வரும் -->
        <div id="loadingView">
            <div class="status-msg">🔍 CALCULATING SHARPNESS TREND...</div>
            <p style="font-size: 12px; color: var(--dim);">Waiting for API trend...</p>
        </div>

        <div id="resultView" style="display:none;">
            <div id="predictionOutput"></div>
            <p style="margin-top:15px; font-size:12px; color:var(--green);">DRAGON SHIELD PROTECTED</p>
        </div>
    </div>
</div>

<script>
// புதுப்பிக்கப்பட்ட API லிங்க் (இது இப்போ வேலை செய்யும்)
const PROXY_URL = 'https://api.allorigins.win/get?url=';
const TARGET_API = encodeURIComponent('https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json');

async function getPrediction() {
    try {
        const response = await fetch(PROXY_URL + TARGET_API);
        const data = await response.json();
        const apiData = JSON.parse(data.contents);
        
        if(apiData && apiData.data && apiData.data.list) {
            const lastResult = apiData.data.list[0];
            const nextPeriod = (BigInt(lastResult.issueNumber) + 1n).toString();
            
            document.getElementById('periodText').innerText = nextPeriod;
            
            // சிவா ஸ்பெஷல் லாஜிக் (உதாரணத்திற்கு: 5-க்கு மேல் இருந்தால் BIG)
            const num = parseInt(lastResult.number);
            const prediction = (num >= 5) ? "SMALL" : "BIG"; 
            
            // UI அப்டேட்
            document.getElementById('loadingView').style.display = 'none';
            document.getElementById('resultView').style.display = 'block';
            
            const output = document.getElementById('predictionOutput');
            output.innerHTML = `<div class="${prediction === 'BIG' ? 'res-big' : 'res-small'}">${prediction}</div>`;
        }
    } catch (error) {
        console.log("API Error, Retrying...");
    }
}

function updateTimer() {
    const now = new Date();
    const seconds = now.getSeconds();
    const remaining = 60 - seconds;
    document.getElementById('timerDisplay').innerText = "00:" + (remaining < 10 ? "0" + remaining : remaining);
    
    // ஒவ்வொரு பீரியட் முடியும் போதும் புது பிரிடிக்ஷன் எடுக்கும்
    if (remaining === 59) {
        document.getElementById('loadingView').style.display = 'block';
        document.getElementById('resultView').style.display = 'none';
        getPrediction();
    }
}

// ஆரம்பிக்கலாம்!
setInterval(updateTimer, 1000);
getPrediction();
</script>
</body>
</html>
